# GRPO/RLVR with the XD-PRM composite reward. PRM weights frozen during RL.
train:
  group_size: 8                 # G samples per prompt
  lr: 1.0e-6
  kl_coef: 0.04                 # leash to the SFT reference (anti-hacking)
  max_prompt_len: 512
  max_new_tokens: 512
  steps: 500
  batch_size: 8
reward:
  # R = a*correct + b*R_aggregate - c*length - d*repetition
  correctness: 1.0
  process: 0.5                  # XD-PRM R_aggregate, frozen
  length_penalty: 0.1
  repetition_penalty: 0.2
  # GRPO advantages are standardized within each prompt group by TRL's trainer itself.
audit_every: 50                 # periodic PRM-vs-ground-truth audit during training
output_subdir: grpo
